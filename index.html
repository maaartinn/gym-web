<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi app de gym</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f2f4f7;
      color: #1d2433;
    }

    .contenedor {
      max-width: 480px;
      margin: 0 auto;
    }

    /* Solo se ve la pantalla que no está oculta */
    .pantalla[hidden] {
      display: none;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin: 24px 0 32px;
    }

    h2 {
      font-size: 1.6rem;
      margin: 16px 0 24px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* Botones grandes de la pantalla de inicio */
    .menu {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .boton-grande {
      width: 100%;
      padding: 24px 20px;
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
      background: #ff5a1f;
      border: none;
      border-radius: 14px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    .boton-grande:active {
      background: #e04a12;
    }

    /* Botón para volver a la pantalla de inicio */
    .boton-volver {
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 600;
      color: #ff5a1f;
      background: #fff;
      border: 1px solid #c8cdd6;
      border-radius: 10px;
    }

    .boton-volver:active {
      background: #f2f4f7;
    }

    .aviso {
      text-align: center;
      font-size: 1.2rem;
      color: #7a8291;
      margin-top: 48px;
    }
  </style>
</head>
<body>
  <div class="contenedor">

    <!-- Pantalla de inicio -->
    <section class="pantalla" id="pantalla-inicio">
      <h1>Mi app de gym</h1>
      <div class="menu">
        <button class="boton-grande" data-ir-a="rutinas">Rutinas</button>
        <button class="boton-grande" data-ir-a="entrenar">Empezar entrenamiento</button>
        <button class="boton-grande" data-ir-a="historial">Historial / Progreso</button>
      </div>
    </section>

    <!-- Pantalla de rutinas (por ahora vacía) -->
    <section class="pantalla" id="pantalla-rutinas" hidden>
      <button class="boton-volver">← Volver</button>
      <h2>Rutinas</h2>
    </section>

    <!-- Pantalla para lo que todavía no está hecho -->
    <section class="pantalla" id="pantalla-proximamente" hidden>
      <button class="boton-volver">← Volver</button>
      <h2 id="titulo-proximamente"></h2>
      <p class="aviso">Próximamente</p>
    </section>

  </div>

  <script>
    // Cada pantalla tiene un nombre corto, que es el que aparece al final
    // de la dirección de la página (por ejemplo: index.html#rutinas).
    const PANTALLAS = {
      inicio: { id: "pantalla-inicio" },
      rutinas: { id: "pantalla-rutinas" },
      entrenar: { id: "pantalla-proximamente", titulo: "Empezar entrenamiento" },
      historial: { id: "pantalla-proximamente", titulo: "Historial / Progreso" }
    };

    // Indica si hemos llegado a la pantalla actual desde dentro de la app
    let vieneDeLaApp = false;

    // Muestra la pantalla que indica la dirección y oculta las demás
    function mostrarPantallaActual() {
      const nombre = location.hash.slice(1);
      const pantalla = PANTALLAS[nombre] || PANTALLAS.inicio;

      document.querySelectorAll(".pantalla").forEach(function (seccion) {
        seccion.hidden = seccion.id !== pantalla.id;
      });

      if (pantalla.titulo) {
        document.getElementById("titulo-proximamente").textContent = pantalla.titulo;
      }

      window.scrollTo(0, 0);
    }

    // Botones de la pantalla de inicio: cambian la dirección y eso cambia la pantalla
    document.querySelectorAll("[data-ir-a]").forEach(function (boton) {
      boton.addEventListener("click", function () {
        vieneDeLaApp = true;
        location.hash = boton.dataset.irA;
      });
    });

    // Botones "Volver": hacen lo mismo que la flecha de atrás del navegador.
    // Si se abrió la página directamente en otra pantalla, van al inicio.
    document.querySelectorAll(".boton-volver").forEach(function (boton) {
      boton.addEventListener("click", function () {
        if (vieneDeLaApp) {
          vieneDeLaApp = false;
          history.back();
        } else {
          location.hash = "inicio";
        }
      });
    });

    window.addEventListener("hashchange", mostrarPantallaActual);
    mostrarPantallaActual();
  </script>
</body>
</html>
